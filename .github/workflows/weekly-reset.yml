name: Weekly Reset Schedules

on:
  # Runs every Friday 16:00 UTC = Saturday 12:00 AM (UTC+8, PH time)
  schedule:
    - cron: "0 16 * * 5"
  # Allow manual runs for testing
  workflow_dispatch:
    inputs:
      teacherId:
        description: "Optional: reset only this teacherId"
        required: false
        default: ""

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (firebase-admin only)
        run: npm i firebase-admin

      - name: Run reset script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          TEACHER_ID: ${{ github.event.inputs.teacherId }}
        run: node scripts/reset-weekly.js

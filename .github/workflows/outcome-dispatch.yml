name: Dispatch Outcome Requests

on:
  # allow manual runs from the Actions tab
  workflow_dispatch:
  # run every 10 minutes
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: outcome-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install only what the script needs (avoids installing your whole app)
      - name: Install firebase-admin
        run: npm i --no-save firebase-admin@^12

      - name: Run dispatcher
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: node scripts/dispatch-outcomes.js

name: consultation-outcome-dispatcher

on:
  # runs every 5 minutes so students get the outcome prompt shortly after a slot ends
  schedule:
    - cron: "*/5 * * * *"
  # lets you run it manually any time from the Actions tab
  workflow_dispatch:

concurrency:
  group: outcome-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run dispatcher
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: node scripts/dispatch-outcome.js

name: Weekly schedule reset

on:
  schedule:
    # Runs every Saturday at 00:00 UTC (see note below to change timezone)
    - cron: "0 16 * * 5"
  workflow_dispatch: {}  # allow manual run from the Actions tab

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps for script
        run: npm i firebase-admin

      - name: Run reset script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/resetWeeklySchedule.js
